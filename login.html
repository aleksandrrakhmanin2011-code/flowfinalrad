<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowRad Private — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#000000;
    color:#cddcf2;
    display:flex; align-items:center; justify-content:center;
  }
  .card {
    width: 320px;
    max-width: calc(100vw - 32px);
    background:#000000;
    border:1px solid #242424;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,0.55);
    padding:26px 24px;
  }
  .brand {
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:500; letter-spacing:0.09em;
    color:#7f96b8;
    margin-bottom:22px;
  }
  .brand .dot {
    width:7px; height:7px; border-radius:50%;
    background:#ffa845; box-shadow:0 0 8px #ffa845;
  }
  h1 {
    font-size:16px; font-weight:600; color:#cddcf2;
    margin-bottom:6px;
  }
  p.sub {
    font-size:12px; color:#7f96b8; margin-bottom:20px;
  }
  input[type="password"] {
    width:100%;
    background:#050505;
    border:1px solid #242424;
    border-radius:9px;
    padding:11px 12px;
    color:#cddcf2;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    outline:none;
    margin-bottom:14px;
  }
  input[type="password"]:focus { border-color:#ffa845; }
  button {
    width:100%;
    background:#ffa845;
    color:#1a1103;
    border:none;
    border-radius:9px;
    padding:11px 12px;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  button:hover { filter:brightness(1.05); }
  .error {
    font-size:11.5px;
    color:#ff6a6a;
    margin-bottom:12px;
    display:none;
  }
  .error.show { display:block; }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <div class="brand"><span class="dot"></span>FLOWRAD PRIVATE</div>
    <h1>Доступ ограничен</h1>
    <p class="sub">Введите пароль для входа в радар</p>
    <div class="error" id="err">Неверный пароль</div>
    <input type="password" name="password" placeholder="Пароль" required autofocus>
    <button type="submit">Войти</button>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const password = form.querySelector('input[name="password"]').value;
        const r = await fetch('/api/auth', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password})
        });
        if (r.ok) {
          const next = new URLSearchParams(location.search).get('next');
          location.replace(next || '/');
        } else {
          err.textContent = 'Неверный или недействительный пароль';
          err.classList.add('show');
        }
      } catch {
        err.textContent = 'Ошибка соединения с сервером';
        err.classList.add('show');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
